name: TION Breezer 4S
products:
  - id: rllylqfcd3lfe3s3
    manufacturer: TION
    model: Breezer 4S
entities:
  - entity: fan
    translation_key: ventilation
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 108
        type: integer
        name: speed
        range:
          min: 1
          max: 6
  - entity: select
    name: Speed
    category: config
    dps:
      - id: 108
        type: integer
        name: option
        mapping:
          - dps_val: 1
            value: "1"
          - dps_val: 2
            value: "2"
          - dps_val: 3
            value: "3"
          - dps_val: 4
            value: "4"
          - dps_val: 5
            value: "5"
          - dps_val: 6
            value: "6"
  - entity: number
    name: Target temperature
    icon: "mdi:thermometer"
    category: config
    class: temperature
    dps:
      - id: 109
        type: integer
        name: value
        unit: "°C"
        range:
          min: 0
          max: 30
        step: 1
  - entity: select
    name: Airflow mode
    icon: "mdi:air-filter"
    category: config
    dps:
      - id: 112
        type: string
        name: option
        mapping:
          - dps_val: Inflow
            value: Fresh air
          - dps_val: Recirc
            value: Recirculation
  - entity: switch
    translation_key: heater
    icon: "mdi:radiator"
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: switch
    translation_key: quiet
    icon: "mdi:volume-off"
    category: config
    dps:
      - id: 106
        type: boolean
        name: switch
  - entity: switch
    translation_key: backlight
    icon: "mdi:led-on"
    category: config
    dps:
      - id: 102
        type: boolean
        name: switch
  - entity: sensor
    translation_key: inlet_temperature
    class: temperature
    dps:
      - id: 9
        type: integer
        name: sensor
        unit: "°C"
        class: measurement
  - entity: sensor
    name: Outlet temperature
    class: temperature
    dps:
      - id: 10
        type: integer
        name: sensor
        unit: "°C"
        class: measurement
  - entity: sensor
    name: DP104 (unknown)
    category: diagnostic
    dps:
      - id: 104
        type: integer
        name: sensor
  - entity: sensor
    name: DP105 (unknown)
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
